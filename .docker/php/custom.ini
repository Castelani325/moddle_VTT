max_execution_time = 600
max_input_time = 600
memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_input_vars = 5000
file_uploads = On
date.timezone = America/Sao_Paulo

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
